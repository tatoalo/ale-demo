<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ settings.app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js" crossorigin="anonymous"></script>
  <script>
    window.SHOP = {
      posthogKey: "{{ settings.posthog_api_key }}",
      posthogHost: "{{ settings.posthog_host }}",
      flags: {{ flags | tojson }},
    };
  </script>
  <script src="/static/app.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">🦔 {{ settings.app_name }}</a>
    <form class="search" action="/" method="get" role="search">
      <input type="search" name="q" placeholder="Search the shop" value="{{ query or '' }}" aria-label="Search">
    </form>
    <nav>
      <a href="/cart" id="cart-button" hx-get="/cart/button" hx-trigger="cart-updated from:body" hx-swap="outerHTML">Cart ({{ cart_count }})</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  {% if flags["assistant-enabled"] %}
  <aside class="assistant" id="assistant">
    <h2>Ask the shop</h2>
    <div id="assistant-log" aria-live="polite"></div>
    <form hx-post="/assistant" hx-target="#assistant-log" hx-swap="beforeend" hx-on::after-request="this.reset()">
      <input name="message" placeholder="What goes well with cold brew?" required autocomplete="off">
      <button type="submit">Ask</button>
    </form>
  </aside>
  {% endif %}
  <footer>A demo shop instrumented with PostHog. Nothing here is for sale.</footer>
</body>
</html>
